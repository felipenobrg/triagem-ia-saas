# Material de estudo. Nenhum segredo real: os valores de exemplo apontam para o ambiente
# descartavel do compose.yaml na raiz do repositorio.
spring:
  application:
    name: triagem-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/triagem}
    username: ${SPRING_DATASOURCE_USERNAME:triagem}
    password: ${SPRING_DATASOURCE_PASSWORD:triagem-sintetico}

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:triagem}
    password: ${SPRING_RABBITMQ_PASSWORD:triagem-sintetico}
    # Publisher confirms e returns: o dispatcher so marca publicado apos confirmacao sem
    # retorno (FR-019).
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        # Retry limitado; esgotado, a mensagem vai para a DLQ em vez de voltar para a fila
        # em loop (FR-021).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

app:
  auth:
    # Identidade real: issuer que aparece no token e endereco interno das chaves.
    issuer: ${APP_AUTH_ISSUER:http://localhost:8081/realms/triagem}
    jwk-set-uri: ${APP_AUTH_JWK_SET_URI:http://localhost:8081/realms/triagem/protocol/openid-connect/certs}
    audience: ${APP_AUTH_AUDIENCE:triagem-backend}
    # Só tem efeito com o perfil "devstub" ativo. Nao satisfaz o FR-001.
    dev-stub-enabled: ${APP_AUTH_DEV_STUB_ENABLED:false}
  messaging:
    dispatcher-enabled: true
    dispatch-interval-ms: 500
  conversation:
    # Valores propostos na Spec 003 e ainda nao validados por evidencia (T3001).
    max-assistant-turns: 10
    max-active-conversations: 5
    max-message-length: 2000
    resolved-confidence-threshold: 0.70
    inactivity-hours: 72
    reopen-days: 7

logging:
  level:
    com.mentoria.triagem: INFO
